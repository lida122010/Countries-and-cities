<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Quiz: Vocabulary Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Global background with animated travel elements -->
  <div class="bg-animation">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="plane">✈️</div>
  </div>

  <div class="game-container">
    <!-- Header: score, progress, restart -->
    <header class="game-header">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span id="scoreDisplay" class="score-value">0</span>
      </div>
      <div class="progress-box">
        <span id="questionCounter" class="question-counter">1 / 10</span>
        <div class="progress-bar-bg">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
      <button id="restartBtn" class="restart-btn" title="Restart game">⟲</button>
    </header>

    <!-- Main quiz area -->
    <main class="quiz-area">
      <div id="questionContainer" class="question-container">
        <p id="questionText" class="question-text">Loading...</p>
        <div id="hintText" class="hint-text"></div>
      </div>

      <!-- Options container -->
      <div id="optionsContainer" class="options-grid"></div>

      <!-- Feedback area -->
      <div id="feedbackMessage" class="feedback-message"></div>

      <!-- Next button -->
      <button id="nextBtn" class="next-btn" disabled>NEXT ➡</button>
    </main>

    <!-- Footer with travel icons -->
    <footer class="game-footer">
      <span>🌍</span><span>🏖️</span><span>🏙️</span><span>🏝️</span><span>🗺️</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
